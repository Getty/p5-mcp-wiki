name    = MCP-Wiki
author  = Torsten Raudssus <getty@cpan.org>
license = Perl_5
copyright_holder = Torsten Raudssus <torsten@raudssus.de> L<https://raudssus.de/>
copyright_year   = 2026
main_module     = lib/MCP/Wiki.pm

; Getty release command:
;   dzil release

[@Author::GETTY]
docker_image = raudssus/mcp-wiki
; The tarball is the Docker build context and what CPAN ships: agent and repo
; housekeeping files stay out. misc/agent-context comes from the bundle.
gather_exclude_match = ^\.claude/
gather_exclude_match = ^\.codex$
gather_exclude_match = ^CLAUDE\.md$
gather_exclude_match = ^PLAN\.md$
gather_exclude_match = ^\.worktreeinclude$
gather_exclude_match = ^\.gitignore$
